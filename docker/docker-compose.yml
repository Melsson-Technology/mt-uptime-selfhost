# MT-Uptime — Docker Compose
#
#     docker compose up -d          then open http://localhost:5081/ and complete the setup wizard.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────────
#  THE VOLUME IS THE POINT OF THIS FILE
#
#  /var/lib/mt-uptime holds two things that must never be separated: the SQLite database, and the
#  Data Protection keys that decrypt every secret inside it (SendGrid credentials, monitored-database
#  passwords, webhook URLs, bot tokens).
#
#  Mount only the database file and MT-Uptime starts, migrates and reports healthy — while unable to
#  decrypt a single stored secret. Nothing throws. Your notification channels simply stop working and
#  the reason is not obvious. Back the two up together or you do not have a backup.
#
#  So: one volume, the whole directory. Do not narrow it.
# ─────────────────────────────────────────────────────────────────────────────────────────────────

name: mt-uptime

services:
  mt-uptime:
    container_name: mt-uptime
    restart: unless-stopped

    # Built from source, because there is no prebuilt image to pull yet — see docker/README.md. The
    # Dockerfile is multi-stage, so this needs no .NET SDK on your machine, just Docker. The context
    # is the repository root, one level up; the Dockerfile expects it.
    build:
      context: ..
      dockerfile: docker/Dockerfile

    # When published images exist, delete the build: block above and uncomment this instead:
    # image: git.melssontechnology.com/melsson-technology/mt-uptime:latest

    ports:
      # host:container. 5081 on the host matches the non-Docker default, which is deliberately not
      # 5000 — that is the ASP.NET Core default and is usually taken already on a shared host.
      # Change the port numbers only; the container side is fixed by ASPNETCORE_URLS in the image.
      #
      # Bound to 127.0.0.1 deliberately. Kestrel serves plain HTTP and has no TLS, so publishing this
      # on every interface would put an unencrypted login form on the network. Put a reverse proxy in
      # front (deploy/mt-uptime.nginx.conf.sample is a worked example) and leave this on loopback.
      #
      # To expose it directly anyway — a trusted LAN, a VPN — change this to "5081:8080" and read the
      # "Exposing it beyond loopback" section in README.md first: it is not just the missing TLS, the
      # rate limiters need a declared proxy to partition on the real client address.
      - "127.0.0.1:5081:8080"

    volumes:
      # The whole state directory. See the header above before changing this line.
      - mt-uptime-data:/var/lib/mt-uptime

      # To use a host directory instead, replace the line above with something like:
      #   - ./data:/var/lib/mt-uptime
      # and first run:  mkdir -p data && sudo chown -R 1654:1654 data
      # A named volume inherits the image's ownership; a bind mount keeps the host's, so without that
      # chown the container cannot write and exits immediately.

    environment:
      TZ: UTC

      # Kestrel runs HTTP only and expects a reverse proxy to terminate TLS. If you put one in front,
      # it must forward the WebSocket upgrade or the live dashboard silently stops updating — the
      # page loads fine, it just never changes. deploy/mt-uptime.nginx.conf.sample is a worked example.

      # Optional engine tuning; sensible defaults apply when unset.
      # Engine__MaxConcurrentChecks: "16"
      # Engine__RawRetentionDays: "30"
      # Engine__HourlyRetentionDays: "180"

      # Workstation GC, set in the image, keeps memory small on a 1 vCPU / 1 GB host. Remove the
      # setting on a larger box if you would rather have throughput.
      # DOTNET_gcServer: "1"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      # First boot runs EF migrations against an empty database; do not fail it for being slow.
      start_period: 20s
      retries: 3

volumes:
  mt-uptime-data:
