# Build and publish the MT-Uptime container image.
#
# Triggered on every push to main. In this project a push to the public repository is a release —
# publishing is one built commit per publish, not a replay of upstream history — so "on push" means
# "on release" here rather than "on every little change".
#
# ─────────────────────────────────────────────────────────────────────────────────────────────────
#  PREREQUISITES — this workflow does nothing until these exist
#
#   1. A registered act_runner on the Gitea instance, with a label matching `runs-on` below, and
#      access to a Docker daemon (a mounted /var/run/docker.sock, or dind).
#      See docker/README.md for the registration command.
#
#   2. Nothing else for the Gitea registry: `secrets.GITEA_TOKEN` is provided automatically.
#
#   3. Docker Hub is optional and off until credentials exist. Set the repository secrets
#      DOCKERHUB_USERNAME and DOCKERHUB_TOKEN and the extra push turns itself on — no edit here.
#
#  NOTE FOR THE PRIVATE UPSTREAM: this file ships inside engine/, so it is also present in the
#  private repository, where a push to main happens constantly. Disable the Actions unit there
#  (Settings -> Units) or every private commit, documentation included, builds an image. A guard on
#  the repository name would fix it here but would break the build for anyone who forks, which is
#  the opposite of why this file is published.
# ─────────────────────────────────────────────────────────────────────────────────────────────────

name: Container image

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for the automatic token. This job builds and pushes a container image; it never writes
# to the repository, so nothing here needs write access. Without an explicit block the token is granted
# the forge's default — read *and* write — and every third-party action in the steps below runs with it.
permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      # The SDK stage cross-publishes and needs no emulation, but the runtime stage installs curl,
      # which does run target-architecture binaries. That single apt-get is the only thing emulated.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130   # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f   # v3

      - name: Work out image names and tags
        id: meta
        run: |
          set -euo pipefail
          REGISTRY="$(echo "${{ github.server_url }}" | sed -E 's#^https?://##')"
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="$REGISTRY/$OWNER/mt-uptime"
          SHORT="$(echo "${{ github.sha }}" | cut -c1-12)"

          # latest, plus an immutable tag. Nobody should have to guess which build is running in
          # production, and `latest` cannot answer that.
          TAGS="$IMAGE:latest,$IMAGE:$SHORT"

          if [ -n "${DOCKERHUB_USERNAME:-}" ]; then
              TAGS="$TAGS,$DOCKERHUB_USERNAME/mt-uptime:latest,$DOCKERHUB_USERNAME/mt-uptime:$SHORT"
          fi

          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS"         >> "$GITHUB_OUTPUT"
          echo "Publishing: $TAGS"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Log in to the Gitea registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9   # v3
        with:
          registry: ${{ steps.meta.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITEA_TOKEN }}

      # Reading the secret through env rather than an `if:` expression, so an unset secret is an
      # empty string rather than a workflow that fails to parse.
      - name: Is Docker Hub configured?
        id: hub
        run: |
          if [ -n "${TOKEN:-}" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "Docker Hub credentials absent — skipping."
          fi
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9   # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8   # v6
        with:
          context: .
          file: docker/Dockerfile
          # arm64 is not optional for this audience: self-hosted monitoring lands on Raspberry Pis
          # and ARM VPSes constantly, and an amd64-only image reads as "not for you".
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
