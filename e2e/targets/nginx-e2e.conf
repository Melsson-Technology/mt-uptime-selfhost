# nginx-e2e.conf — the HTTP and HTTPS faces of the E2E fixture backend.
#
# Installed by install-targets.sh to /etc/nginx/conf.d/mt-uptime-e2e.conf.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────────
#  WHY conf.d/ AND NOT sites-enabled/
#
#  provision.sh removes nginx's stock `default` site only when nothing else is enabled:
#
#      OTHER_SITES="$(find /etc/nginx/sites-enabled -mindepth 1 ! -name mt-uptime ! -name default | wc -l)"
#      if [[ "$OTHER_SITES" -eq 0 ]]; then rm -f /etc/nginx/sites-enabled/default; fi
#
#  A file of ours in sites-enabled makes that count 1, so `default` survives. Ubuntu's `default` is
#  `listen 80 default_server`, while mt-uptime's site is a plain `listen 80` with a server_name — so
#  the Ubuntu welcome page wins every request whose Host does not match, including
#  `curl http://127.0.0.1/healthz`. Tier 0 would then report the product's health endpoint as a 404
#  that the test harness caused.
#
#  conf.d/ is included at http{} scope just like sites-enabled/, serves our purpose identically, and
#  is invisible to that count — so install-targets.sh can run before or after provision.sh without
#  changing what provision.sh decides.
# ─────────────────────────────────────────────────────────────────────────────────────────────────
#
#  Nothing here may define anything at http{} scope. mt-uptime.nginx.conf.sample already declares
#  `map $http_upgrade $connection_upgrade` and `log_format mt_uptime_scrubbed`; redefining either is a
#  duplicate-directive error, and `nginx -t` failing makes provision.sh delete its own site and exit 1.
#  Server blocks only, therefore, and no shared names.
#
#  Every listen is explicitly bound to 127.0.0.1 and carries no default_server. These ports exist for
#  the monitors on this box and must not be reachable from the security group, and a stray
#  default_server here would silently capture unmatched requests on a port we do not own.

# Plain HTTP — the everyday target for HTTP monitors.
server {
    listen 127.0.0.1:8081;
    listen [::1]:8081;
    server_name _;

    access_log /var/log/nginx/mt-uptime-e2e.access.log;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        # The fixture echoes headers back on /echo, so anything added here shows up in a keyword
        # assertion. Keep this list minimal and boring for exactly that reason.
        proxy_set_header X-Forwarded-For $remote_addr;

        # /slow and the slow arm of /toggle block for over a second by design. nginx's default
        # read timeout is 60s, which is fine — but proxy_buffering would hold the upstream's headers
        # until the body arrived, and HttpChecker measures latency to the HEADERS. Buffering would
        # make a deliberately-slow response look fast and quietly disarm every Degraded prediction.
        proxy_buffering off;
    }
}

# ─────────────────────────────────────────────────────────────────────────────────────────────────
#  The four HTTPS faces. Same backend, four certificates:
#
#    8443  valid       365 days out          TLS monitor -> Up
#    8444  expiring    ~5 days out           Up at WarnDays 3, Down at WarnDays 14
#    8445  expired     ended two days ago    Down, "Certificate expired Nd ago"
#    8446  untrusted   valid, unknown issuer TLS monitor -> Up (it never checks the chain),
#                                            HTTP monitor -> Down unless IgnoreTlsErrors
#
#  nginx serves an expired certificate without complaint, which is what makes 8445 possible at all.
#  ssl_verify_client is off by default; none of these ask the client for a certificate.
# ─────────────────────────────────────────────────────────────────────────────────────────────────

server {
    listen 127.0.0.1:8443 ssl;
    listen [::1]:8443 ssl;
    server_name _;
    ssl_certificate     /etc/mt-uptime-e2e/certs/web/valid.crt;
    ssl_certificate_key /etc/mt-uptime-e2e/certs/web/valid.key;
    location / { proxy_pass http://127.0.0.1:8090; proxy_set_header Host $host; proxy_buffering off; }
}

server {
    listen 127.0.0.1:8444 ssl;
    listen [::1]:8444 ssl;
    server_name _;
    ssl_certificate     /etc/mt-uptime-e2e/certs/web/expiring.crt;
    ssl_certificate_key /etc/mt-uptime-e2e/certs/web/expiring.key;
    location / { proxy_pass http://127.0.0.1:8090; proxy_set_header Host $host; proxy_buffering off; }
}

server {
    listen 127.0.0.1:8445 ssl;
    listen [::1]:8445 ssl;
    server_name _;
    ssl_certificate     /etc/mt-uptime-e2e/certs/web/expired.crt;
    ssl_certificate_key /etc/mt-uptime-e2e/certs/web/expired.key;
    location / { proxy_pass http://127.0.0.1:8090; proxy_set_header Host $host; proxy_buffering off; }
}

server {
    listen 127.0.0.1:8446 ssl;
    listen [::1]:8446 ssl;
    server_name _;
    ssl_certificate     /etc/mt-uptime-e2e/certs/web/untrusted.crt;
    ssl_certificate_key /etc/mt-uptime-e2e/certs/web/untrusted.key;
    location / { proxy_pass http://127.0.0.1:8090; proxy_set_header Host $host; proxy_buffering off; }
}
