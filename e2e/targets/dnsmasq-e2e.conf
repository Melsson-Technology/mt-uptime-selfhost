# dnsmasq-e2e.conf — an authoritative resolver for e2e.test, so DNS monitors have real records.
#
# Installed by install-targets.sh to /etc/dnsmasq.d/mt-uptime-e2e.conf.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────────
#  THE TWO WAYS THIS BREAKS A BOX, AND WHY EACH LINE IS HERE
#
#  1. It fights systemd-resolved for port 53.
#
#     Ubuntu runs systemd-resolved on 127.0.0.53:53. dnsmasq's default is to bind the WILDCARD
#     address, which collides, so the package's own post-install start fails — and it fails during
#     `apt-get install`, before any config of ours could exist. That is why install-targets.sh writes
#     this file BEFORE installing the package, not after.
#
#     listen-address alone is not enough: without bind-interfaces, dnsmasq still binds the wildcard
#     and merely filters by source address. Both lines are required, and neither is optional.
#
#  2. It hijacks the system resolver.
#
#     The Debian package ships a resolvconf hook that points /etc/resolv.conf at dnsmasq. With
#     no-resolv set and no upstream servers configured, that would leave the box unable to resolve
#     anything at all — no apt, no NuGet, no dotnet-install.sh — which is a spectacular way to lose an
#     afternoon. install-targets.sh neutralises the hook via DNSMASQ_EXCEPT and IGNORE_RESOLVCONF in
#     /etc/default/dnsmasq, and its self-check asserts that archive.ubuntu.com still resolves.
#
#  Consequence worth keeping in mind: the system resolver knows nothing about e2e.test, deliberately.
#  Routing ~e2e.test to this instance via resolved.conf.d is NOT done, because a DNS monitor with a
#  blank Resolver is supposed to exercise the system-resolver path. That is why the blank-Resolver test
#  uses a public name and is tagged Requires=Internet.
# ─────────────────────────────────────────────────────────────────────────────────────────────────

port=53
listen-address=127.0.0.2
bind-interfaces

# 127.0.0.2 needs no `ip addr add`: the whole of 127/8 is already on `lo`.

# No upstream, no /etc/hosts. This resolver exists to answer for one zone and to REFUSE everything
# else — which is itself a tested behaviour, and would silently become "forward to the internet" if
# either line were dropped.
no-resolv
no-hosts

# Authoritative for the zone: a name inside it that has no record gets NXDOMAIN rather than a referral.
local=/e2e.test/

# A and AAAA on one name. IPAddress.ToString() renders the v6 answer as fd00:e2e::10, which is exactly
# what the AAAA assertion compares against — the record is written in the same compressed form here so
# the two cannot drift.
host-record=a.e2e.test,10.10.10.10,fd00:e2e::10

# The CNAME and MX targets have to be names dnsmasq itself knows, or it refuses to serve them. This
# record exists only to be that target.
host-record=mail.e2e.test,10.10.10.25

# DnsClient renders CNAME and MX answers with a trailing dot (DnsString.Value), so the expected values
# in the manifest carry one. A test that asserts "a.e2e.test" still passes, because ExpectedValue is a
# substring match — which is worth knowing rather than discovering.
cname=cname.e2e.test,a.e2e.test
mx-host=e2e.test,mail.e2e.test,10
txt-record=txt.e2e.test,mt-uptime-e2e

# missing.e2e.test is deliberately absent: `local=` above turns it into NXDOMAIN, which DnsClient
# reports as "Non-Existent Domain" — the string the DNS failure test asserts on.
