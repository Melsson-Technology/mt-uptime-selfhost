# postgres-e2e.conf — TLS and loopback settings for the PostgreSQL monitor target.
#
# Installed by install-targets.sh to /etc/postgresql/<version>/main/conf.d/mt-uptime-e2e.conf.
#
# The version is discovered rather than hardcoded (`ls /etc/postgresql | sort -V | tail -1`), and the
# unit to reload is the per-cluster one — postgresql@16-main.service — not the postgresql.service
# umbrella, which is a wrapper that reports success without necessarily having reloaded the cluster
# you meant.

# Loopback only, for the same reason as MySQL.
listen_addresses = '127.0.0.1'

# ─────────────────────────────────────────────────────────────────────────────────────────────────
#  THE KEY'S OWNERSHIP IS A START-OR-DIE CONDITION
#
#  PostgreSQL refuses to start — not warn, not disable TLS, refuse — if ssl_key_file is group- or
#  world-readable, or is owned by anyone other than the cluster user or root. install-targets.sh
#  therefore chowns this key to postgres:postgres 0600 after make-certs.sh has minted it.
#
#  This is the opposite failure mode to MySQL's, and the contrast is worth remembering: MySQL starts
#  with TLS silently off, Postgres does not start at all. The loud one is easier to diagnose.
# ─────────────────────────────────────────────────────────────────────────────────────────────────
ssl = on
ssl_cert_file = '/etc/mt-uptime-e2e/certs/postgres/server.crt'
ssl_key_file = '/etc/mt-uptime-e2e/certs/postgres/server.key'

# Present so the server can verify client certificates if that is ever tested. Nothing does today —
# the checker never sends one — but it costs nothing and documents which CA is ours.
ssl_ca_file = '/etc/mt-uptime-e2e/certs/ca/ca.crt'

# A reload is enough for the SSL files themselves; only a change to listen_addresses needs a restart.
# install-targets.sh restarts only when this file's contents actually changed.
